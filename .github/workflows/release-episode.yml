name: Release episode

# The daily Liuwa Pod routine cannot create releases itself (its GitHub proxy
# refuses release calls), but it can push a branch. It pushes episode/ep<n>
# holding the MP3 and a release.json ({"name": ..., "body": ...}). This
# workflow turns that branch into release ep<n> with the MP3 attached, then
# deletes the branch so the repository stays small.

on:
  push:
    branches: ['episode/**']

permissions:
  contents: write
  pages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the release from the branch contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#episode/}"
          mp3=$(ls *.mp3 | head -1)
          [ -n "$mp3" ] || { echo "::error::no .mp3 on branch $GITHUB_REF_NAME"; exit 1; }
          title=$(jq -r '.name // empty' release.json 2>/dev/null || true)
          notes=$(jq -r '.body // empty' release.json 2>/dev/null || true)
          [ -n "$title" ] || title="Liuwa Pod $tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$mp3" --clobber
          else
            gh release create "$tag" "$mp3" --target main --title "$title" --notes "$notes"
          fi
          echo "release $tag: $mp3"

      - name: Mirror the latest episodes to the audio branch (GitHub Pages serves them as audio/mpeg)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mp3=$(ls *.mp3 | head -1)
          work=$(mktemp -d)
          if git fetch -q origin audio 2>/dev/null; then git archive origin/audio | tar -x -C "$work"; fi
          cp "$mp3" "$work/"
          cd "$work"
          touch .nojekyll
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Liuwa Pod audio</title><p>Audio files for <a href="https://liuwa.co.zm/pod/">Liuwa Pod</a>. Episodes are also archived as releases of this repository.' > index.html
          ls *.mp3 | sort | head -n -60 | xargs -r rm -f
          git init -q -b audio
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "audio: $(ls *.mp3 | wc -l | tr -d ' ') episodes, latest $mp3"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" audio:audio
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || echo "pages build request failed (the push may build on its own)"

      - name: Delete the episode branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}"
